# 本地开发快速验证模板（host 侧）
#
# 用法：把下面的绝对路径改成你本机的仓库路径，然后：
#   pnpm install && pnpm build
#   npx @deepseek-ai/dsh web --patch ./dev-cordis.yml
#
# ⚠️ name 必须指向编译产物 lib/index.js——TS 源码里的 NodeNext 风格 import
#   （'./api/mock.js'）在 Node 原生加载 .ts 时不会映射回 .ts，直接指 src 会
#   ERR_MODULE_NOT_FOUND。改动 src 后先 pnpm build 再启动（或挂 pnpm build --watch）。
- insert:
    - id: lighthouse-expert
      name: '/absolute/path/to/dsh-lighthouse-expert/lib/index.js'
